spring.application.name=FestivalFerentoSIW

#==================================
# = Connessione al database
#==================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/FestivalFerentoSIW
spring.datasource.username=postgres
spring.datasource.password=postgres

#==================================
# = JPA / Hibernate
#==================================
spring.jpa.database=POSTGRESQL
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
spring.jpa.properties.hibernate.generate_statistics=true

#==================================
# = Server web
#==================================
server.port=8080

#==================================
# = Thymeleaf
#==================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.suffix=.html
spring.thymeleaf.servlet.content-type=text/html

#==================================
# = Upload immagini (locandine)
#==================================
# Cartella su disco dove vengono salvate le immagini caricate dall'admin.
# E' ESTERNA al progetto (non dentro static/), perche' static viene fissata
# alla compilazione e non accetta file scritti mentre l'app gira.
app.upload.dir=uploads/images

# Dimensione massima di un singolo file e dell'intera richiesta.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB