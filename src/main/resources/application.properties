spring.application.name=FestivalFerentoSIW

#==================================
# = Connessione al database
#==================================
# L'URL deve combaciare ESATTAMENTE con il nome del database creato
# in pgAdmin 4 (PostgreSQL distingue maiuscole e minuscole).
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/FestivalFerentoSIW
spring.datasource.username=postgres
spring.datasource.password=postgres

#==================================
# = JPA / Hibernate
#==================================
spring.jpa.database=POSTGRESQL

# ddl-auto=create: a ogni avvio Hibernate CANCELLA e RICREA le tabelle
# a partire dalle entita' annotate con @Entity.
# Comodissimo in sviluppo (il database segue sempre il modello a oggetti,
# senza migrazioni a mano), ma attenzione: ogni riavvio azzera i dati.
# Per questo i dati di prova li metteremo in import.sql, che Hibernate
# esegue automaticamente subito dopo aver creato le tabelle.
spring.jpa.hibernate.ddl-auto=create

# Stampa in console le query SQL generate da Hibernate.
# Serve a capire cosa succede davvero sotto le annotazioni JPA:
# e' lo strumento principale per accorgersi del problema delle N+1 query.
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

# Raccoglie statistiche di Hibernate (numero di query eseguite, tempi):
# utile piu' avanti se vorremo confrontare strategie di fetch.
spring.jpa.properties.hibernate.generate_statistics=true

#==================================
# = Server web
#==================================
server.port=8080

#==================================
# = Thymeleaf
#==================================
# cache=false: in sviluppo permette di modificare un template HTML e
# vedere il risultato con un semplice refresh del browser, senza
# riavviare l'applicazione.
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.suffix=.html
spring.thymeleaf.servlet.content-type=text/html