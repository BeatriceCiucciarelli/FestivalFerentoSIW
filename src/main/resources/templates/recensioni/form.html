<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(title='Recensione')}"></head>
<body>
<nav th:replace="~{fragments/common :: nav}"></nav>

<div class="container" style="max-width: 560px;">

    <p class="mb-3">
        <a th:href="@{/spettacoli/{id}(id=${spettacolo.id})}">&larr; Torna allo spettacolo</a>
    </p>

    <!-- Titolo diverso a seconda che sia creazione o modifica: lo capiamo
         dall'id della recensione (null = nuova, valorizzato = esistente). -->
    <h1 class="mb-1" th:text="${recensione.id == null} ? 'Scrivi una recensione' : 'Modifica la tua recensione'">
        Recensione
    </h1>
    <p class="text-muted" th:text="${spettacolo.titolo}">Titolo spettacolo</p>

    <!-- L'action cambia in base al caso:
         - nuova recensione   -> POST /recensioni
         - modifica esistente -> POST /recensioni/{id} -->
    <form th:action="${recensione.id == null} ? @{/recensioni} : @{/recensioni/{id}(id=${recensione.id})}"
          th:object="${recensione}" method="post" class="mt-3">

        <!-- L'id dello spettacolo serve solo in creazione. -->
        <input th:if="${recensione.id == null}" type="hidden" name="spettacoloId" th:value="${spettacolo.id}" />

        <div class="mb-3">
            <label for="voto" class="form-label">Voto</label>
            <select id="voto" th:field="*{voto}" class="form-select"
                    th:classappend="${#fields.hasErrors('voto')} ? 'is-invalid'">
                <option th:value="5">★★★★★ (5)</option>
                <option th:value="4">★★★★ (4)</option>
                <option th:value="3">★★★ (3)</option>
                <option th:value="2">★★ (2)</option>
                <option th:value="1">★ (1)</option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('voto')}" th:errors="*{voto}">Errore voto</div>
        </div>

        <div class="mb-3">
            <label for="testo" class="form-label">La tua recensione</label>
            <textarea id="testo" th:field="*{testo}" rows="4" class="form-control"
                      th:classappend="${#fields.hasErrors('testo')} ? 'is-invalid'"></textarea>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('testo')}" th:errors="*{testo}">Errore testo</div>
        </div>

        <button type="submit" class="btn btn-primary"
                th:text="${recensione.id == null} ? 'Pubblica recensione' : 'Salva modifiche'">Salva</button>
    </form>

</div>

</body>
</html>
